crons:
  - name: ai-review-daily
    description: "Dispara la revisión IA automática del bot a las 08:00 UTC; el backend decide si toca según la frecuencia configurada"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/ai-review"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: walk-forward-weekly
    description: "Revalida cada lunes 07:00 UTC con walk-forward los pares con SL/TP optimizados de ambos bots (Bybit y HotForex) y avisa por Telegram si alguno se sobreajusta"
    cron: "0 7 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/walk-forward"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-summary
    description: "Envía cada domingo 20:00 UTC el resumen semanal por Telegram: PnL, mejores y peores pares, valor del filtro IA y plan"
    cron: "0 20 * * 0"
    endpoint: "{{BASE_URL}}/api/cron/weekly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
